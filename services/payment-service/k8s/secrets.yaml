# Example Kubernetes secrets for payment-service
# In production, these should be created using kubectl or a secrets management system
# DO NOT commit actual secrets to version control

apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secrets
  namespace: production
type: Opaque
stringData:
  db-url: "jdbc:postgresql://postgres-service:5432/casino_payments"
  db-username: "payment_user"
  db-password: "CHANGE_ME_IN_PRODUCTION"
  # Add other secrets as needed (e.g., payment gateway API keys)
