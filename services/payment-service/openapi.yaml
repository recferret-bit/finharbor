openapi: 3.0.3
info:
  title: Payment Service API
  description: |
    Payment Service for Casino Backend - Handles payment processing, 
    payment status queries, and payment history.
  version: 2.5.1
  contact:
    name: Core Team Backend
    email: core-team@casino.example.com

servers:
  - url: https://api.casino.example.com/payments
    description: Production server
  - url: https://api-staging.casino.example.com/payments
    description: Staging server
  - url: http://localhost:8080/api/payments
    description: Local development server

tags:
  - name: Payments
    description: Payment processing operations

paths:
  /process:
    post:
      tags:
        - Payments
      summary: Process a payment
      description: |
        Initiates a payment transaction. Publishes `core.payment.initiated` event.
        Returns payment result with status (completed/failed).
      operationId: processPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        '400':
          description: Invalid payment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{paymentId}:
    get:
      tags:
        - Payments
      summary: Get payment status
      description: Retrieve payment details by payment ID
      operationId: getPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique payment identifier
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /history/{userId}:
    get:
      tags:
        - Payments
      summary: Get payment history for user
      description: Retrieve payment history for a specific user
      operationId: getPaymentHistory
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User identifier
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of payments to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of payments to skip
      responses:
        '200':
          description: Payment history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHistoryResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags:
        - Payments
      summary: Health check endpoint
      description: Returns service health status
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    PaymentRequest:
      type: object
      required:
        - userId
        - amount
        - currency
        - paymentMethod
      properties:
        userId:
          type: string
          format: uuid
          description: User making the payment
        amount:
          type: number
          format: decimal
          minimum: 0.01
          description: Payment amount
        currency:
          type: string
          enum: [USD, EUR, GBP, CAD, AUD]
          description: Currency code (ISO 4217)
        paymentMethod:
          type: string
          enum: [CREDIT_CARD, DEBIT_CARD, BANK_TRANSFER, E_WALLET]
          description: Payment method type
        paymentMethodId:
          type: string
          description: Payment method identifier (e.g., card token)
        description:
          type: string
          maxLength: 500
          description: Optional payment description
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata for the payment

    PaymentResult:
      type: object
      required:
        - paymentId
        - status
        - amount
        - currency
      properties:
        paymentId:
          type: string
          format: uuid
          description: Unique payment identifier
        status:
          type: string
          enum: [COMPLETED, FAILED, PENDING]
          description: Payment status
        amount:
          type: number
          format: decimal
          description: Payment amount
        currency:
          type: string
          description: Currency code
        transactionId:
          type: string
          description: External transaction identifier (e.g., from payment gateway)
        errorCode:
          type: string
          description: Error code if payment failed
        errorMessage:
          type: string
          description: Error message if payment failed
        timestamp:
          type: string
          format: date-time
          description: Payment processing timestamp

    Payment:
      type: object
      required:
        - paymentId
        - userId
        - amount
        - currency
        - status
        - createdAt
      properties:
        paymentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
        currency:
          type: string
        status:
          type: string
          enum: [COMPLETED, FAILED, PENDING, CANCELLED]
        paymentMethod:
          type: string
        transactionId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        errorCode:
          type: string
        errorMessage:
          type: string

    PaymentHistoryResponse:
      type: object
      required:
        - payments
        - total
        - limit
        - offset
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        total:
          type: integer
          description: Total number of payments for the user
        limit:
          type: integer
        offset:
          type: integer

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [UP, DOWN]
            kafka:
              type: string
              enum: [UP, DOWN]

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: API path that caused the error

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - BearerAuth: []
