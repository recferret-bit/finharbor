server:
  port: 8080
  servlet:
    context-path: /api/v1/balance

spring:
  application:
    name: balance-service
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/casino_db}
    username: ${DATABASE_USERNAME:casino_user}
    password: ${DATABASE_PASSWORD:casino_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: balance-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Kafka Topics
kafka:
  topics:
    balance-updated: ${KAFKA_TOPIC_BALANCE_UPDATED:balance-updated}

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    com.casino.balance: INFO
    org.springframework.kafka: WARN
    org.hibernate: WARN
